<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simble blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form_container">
        <h1>Simple blog</h1>
        <form action="" id="form">
            <h2>Create a New Post</h2>
            <input type="text" name="" id="post_title" placeholder="Post title"> <br>
            <input type="text" id="image" placeholder="image URL (optional)"> <br>
            <textarea name="comments" id="post_desc" placeholder="Write Your Post Here ....."></textarea> <br>
            <button type="submit">Add A Post</button>
        </form>
    </div>
    <div id="posts">
        <h1>All Posts</h1>
        <ul id="list">
        </ul>
    </div>



    <script src="script.js"></script>
</body>

</html>
