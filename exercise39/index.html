<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Language Translator</h1>

        <div class="form-group">
          <label for="from-lang">From:</label>
         <select id="from-lang" name="to" class="to-select">
            <option value="somali" selected>Somali</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="zh">Chinese</option>
            <option value="tr">Turkish</option>
          </select>
        </div>

        <div class="form-group">
          <label for="to-lang" class="to-label">To:</label>
          <select id="to-lang" name="to" class="to-select">
            <option value="en" selected>English</option>
            <option value="so">Somaali</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="zh">Chinese</option>
            <option value="tr">Turkish</option>
          </select>
        </div>

        <div class="form-group">
         <label for="text-input">Text to Translate:</label>
         <textarea id="text-input" name="text" placeholder="Enter text here..."></textarea>
        </div>

        <button class="btn-translate">Translate</button>

        <div class="result">
          <h2>Translated Text:</h2>
          <p id="output"></p>
        </div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
